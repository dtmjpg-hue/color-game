<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ふわふわバルーン</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c4a6e; color: #fff;
    font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #hud { padding: 8px 14px; background: #082f49; }
  #stats { display: flex; justify-content: space-between; font-size: 17px; font-weight: bold; }
  #hintRow { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
  #hint { flex: 1; text-align: center; font-size: 15px; color: #fde047; }
  #muteBtn { width: 42px; height: 42px; min-width: 42px; min-height: 42px; margin: 0; padding: 0; font-size: 21px;
    border-radius: 50%; background: rgba(255,255,255,.16); color: #fff; border: none; cursor: pointer; }
  #field { position: relative; flex: 1; overflow: hidden; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .fb { position: absolute; left: 0; right: 0; text-align: center; font-size: 28px; font-weight: bold;
    pointer-events: none; animation: rise .9s ease-out forwards; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  .lv { color: #fde047; font-size: 34px; }
  .bad { color: #fecaca; }
  @keyframes rise { to { transform: translateY(-46px); opacity: 0; } }
  #overlay { position: absolute; inset: 0; background: rgba(4,26,46,.94); display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 22px; text-align: center; z-index: 10; }
  #overlay h1 { font-size: 30px; margin: 0 0 12px; }
  #overlay p { font-size: 17px; line-height: 1.7; margin: 4px 0; max-width: 320px; }
  .big { font-size: 46px; font-weight: bold; color: #fde047; margin: 6px 0; }
  #startBtn { margin-top: 22px; min-width: 200px; min-height: 56px; padding: 14px 36px; font-size: 22px;
    font-weight: bold; color: #3a2a00; background: #fde047; border: none; border-radius: 14px; cursor: pointer; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div id="stats">
      <span>スコア <span id="score">0</span></span>
      <span>レベル <span id="level">1</span></span>
      <span>ライフ <span id="life">♥♥♥</span></span>
    </div>
    <div id="hintRow">
      <div id="hint">タップで、ふわっと上がる!</div>
      <button id="muteBtn" type="button" aria-label="音のオンとオフ">🔊</button>
    </div>
  </div>
  <div id="field">
    <canvas id="cv"></canvas>
    <div id="overlay">
      <h1 id="ovTitle">ふわふわバルーン</h1>
      <div id="ovBody">
        <p>画面を<b>タップ</b>すると、風船が<b>ふわっと上がる</b>よ。何もしないと、ゆっくり下がるよ。</p>
        <p>柱の<b>すきま</b>を、くぐり抜けよう。すきまの<b>星</b>を取ると、ボーナス。音も鳴るよ!</p>
        <p>柱や地面にぶつかると、ライフが1つ減る。ライフは3つ。</p>
        <p>進むほど、速くなって、すきまがせまくなるよ。</p>
      </div>
      <button id="startBtn" type="button">スタート</button>
    </div>
  </div>
</div>

<script>
(function () {
  var field = document.getElementById("field");
  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var scoreEl = document.getElementById("score");
  var levelEl = document.getElementById("level");
  var lifeEl = document.getElementById("life");
  var hintEl = document.getElementById("hint");
  var overlay = document.getElementById("overlay");
  var ovTitle = document.getElementById("ovTitle");
  var ovBody = document.getElementById("ovBody");
  var startBtn = document.getElementById("startBtn");

  // ===== 効果音(Web Audioで作る。音声ファイルは使わない) =====
  var soundOn = true;
  try { soundOn = localStorage.getItem("fuwa_sound") !== "off"; } catch (e) {}
  var ac = null;
  function audio() {
    if (!soundOn) return null;
    try {
      if (!ac) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) ac = new AC(); }
      if (ac && ac.state === "suspended") ac.resume();
    } catch (e) { ac = null; }
    return ac;
  }
  function tone(freq, dur, type, vol, slideTo, delay) {
    var a = audio();
    if (!a) return;
    try {
      var t0 = a.currentTime + (delay || 0);
      var o = a.createOscillator(), g = a.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(freq, t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(a.destination);
      o.start(t0); o.stop(t0 + dur + 0.03);
    } catch (e) {}
  }
  function flapSound() { tone(380, 0.13, "sine", 0.1, 760); }
  function overSound() {
    tone(392, 0.22, "triangle", 0.14);
    tone(330, 0.22, "triangle", 0.14, null, 0.2);
    tone(262, 0.45, "triangle", 0.14, null, 0.4);
  }
  // 星をとるたびに、音階が上がっていく
  var SCALE = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5, 1568];
  function starSound(n) {
    var f = SCALE[Math.min(n, SCALE.length - 1)];
    tone(f, 0.28, "sine", 0.18); tone(f * 2, 0.18, "triangle", 0.06, null, 0.04);
  }

  var W = 0, H = 0, dpr = 1;
  var score = 0, level = 1, lives = 3, passed = 0, starChain = 0;
  var running = false, gen = 0, lastT = 0, shake = 0;
  var bx = 0, by = 0, vy = 0, BR = 19, inv = 0, tilt = 0;
  var gates = [], fx = [], texts = [], clouds = [], spawnX = 0;
  var GW = 64;                 // 柱の太さ

  function loadBest() { try { return parseInt(localStorage.getItem("fuwa_best") || "0", 10) || 0; } catch (e) { return 0; } }
  function saveBest(v) { try { localStorage.setItem("fuwa_best", String(v)); } catch (e) {} }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = field.clientWidth; H = field.clientHeight;
    cv.width = Math.floor(W * dpr); cv.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bx = W * 0.3;
    if (!clouds.length) for (var i = 0; i < 6; i++) clouds.push({ x: Math.random() * 500, y: 40 + Math.random() * 500, s: 0.6 + Math.random() * 0.9 });
  }

  function render() {
    scoreEl.textContent = String(score);
    levelEl.textContent = String(level);
    var h = "";
    for (var i = 0; i < 3; i++) h += (i < lives ? "♥" : "♡");
    lifeEl.textContent = h;
  }

  function feedback(text, cls) {
    var f = document.createElement("div");
    f.className = "fb " + cls; f.textContent = text;
    f.style.top = Math.round(H * 0.04) + "px";
    field.appendChild(f);
    setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 950);
  }

  // 難しさ(レベルで変わる)
  function speedNow() { return Math.min(230, 120 + (level - 1) * 12); }
  function gapNow() { return Math.max(138, 215 - (level - 1) * 8); }
  function spacingNow() { return Math.max(205, 250 - (level - 1) * 6); }

  function addGate() {
    var gap = gapNow();
    var lo = 70 + gap / 2, hi = H - 70 - gap / 2;
    var prev = gates.length ? gates[gates.length - 1].cy : (H / 2);
    // 前のすきまから、動かせる範囲に収める(ぜったいに通れるように)
    var maxMove = Math.min(hi - lo, 150 + level * 4);
    var cy = prev + (Math.random() * 2 - 1) * maxMove;
    cy = Math.max(lo, Math.min(hi, cy));
    gates.push({ x: spawnX, cy: cy, gap: gap, done: false, hit: false, star: Math.random() < 0.75, got: false });
    spawnX += spacingNow();
  }

  function startGame() {
    gen += 1;
    audio(); tone(660, 0.08, "triangle", 0.14);
    score = 0; level = 1; lives = 3; passed = 0; starChain = 0;
    by = H * 0.45; vy = 0; inv = 0; tilt = 0; shake = 0;
    gates = []; fx = []; texts = [];
    spawnX = W - 30;
    for (var i = 0; i < 4; i++) addGate();
    render();
    hintEl.textContent = "タップで、ふわっと上がる!";
    overlay.style.display = "none";
    running = true;
  }

  function endGame(g) {
    if (g !== gen) return;
    running = false;
    var best = loadBest(), isNew = score > best;
    if (isNew) { best = score; saveBest(best); }
    ovTitle.textContent = "ゲームオーバー";
    ovBody.innerHTML =
      '<p>最終スコア</p><div class="big">' + score + '点</div>' +
      '<p>レベル ' + level + ' まで進んだよ</p>' +
      '<p>ベスト: ' + best + '点' + (isNew ? '(新記録!)' : '') + '</p>';
    startBtn.textContent = "もういちど";
    overlay.style.display = "flex";
    overSound();
  }

  function addText(x, y, text, color) { texts.push({ x: x, y: y, text: text, color: color, t: 0 }); }
  function burst(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.PI * 2 * i / n + Math.random() * 0.4, sp = 80 + Math.random() * 120;
      fx.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, color: color, t: 0 });
    }
  }

  function hurt(text) {
    if (inv > 0 || !running) return;
    lives -= 1; inv = 1.3; starChain = 0; shake = 10;
    burst(bx, by, "#f87171", 10);
    tone(180, 0.3, "sawtooth", 0.11, 80);
    feedback(text, "bad");
    vy = -260;
    render();
    if (lives <= 0) {
      running = false;
      var g = gen;
      setTimeout(function () { endGame(g); }, 700);
    }
  }

  field.addEventListener("pointerdown", function (ev) {
    if (!running) return;
    ev.preventDefault();
    vy = -330;                 // 連打しても、上がる力は増えない(速度をセットするだけ)
    flapSound();
    burst(bx - 6, by + BR, "rgba(255,255,255,.9)", 3);
  });

  function frame(t) {
    var dt = Math.min(0.05, (t - lastT) / 1000 || 0);
    lastT = t;

    // 雲(いつも、ゆっくり流れる)
    for (var c = 0; c < clouds.length; c++) {
      clouds[c].x -= dt * (14 + clouds[c].s * 10);
      if (clouds[c].x < -120) { clouds[c].x = W + 60; clouds[c].y = 40 + Math.random() * (H - 200); }
    }

    if (running) {
      var sp = speedNow();
      vy += 860 * dt;
      if (vy > 420) vy = 420;
      by += vy * dt;
      tilt += ((vy / 420) * 0.35 - tilt) * Math.min(1, dt * 8);
      if (by < BR) { by = BR; if (vy < 0) vy = 0; }
      if (by > H - BR - 4) { by = H - BR - 4; hurt("ぶつかった!"); vy = -300; }
      if (inv > 0) inv -= dt;

      for (var i = gates.length - 1; i >= 0; i--) {
        var g = gates[i];
        g.x -= sp * dt;
        var top = g.cy - g.gap / 2, bot = g.cy + g.gap / 2;
        // 柱との当たり
        if (bx + BR - 4 > g.x && bx - BR + 4 < g.x + GW) {
          if (by - BR + 4 < top || by + BR - 4 > bot) { g.hit = true; hurt("ぶつかった!"); }
        }
        // 星
        if (g.star && !g.got) {
          var sx = g.x + GW / 2, sy = g.cy;
          var dx = sx - bx, dy = sy - by;
          if (dx * dx + dy * dy < (BR + 17) * (BR + 17)) {
            g.got = true; score += 2; starChain += 1;
            starSound(starChain - 1);
            burst(sx, sy, "#fde047", 12);
            addText(sx, sy - 24, "+2", "#fde047");
            render();
          }
        }
        // くぐり抜けた
        if (!g.done && g.x + GW < bx - BR) {
          g.done = true;
          if (!g.hit) {
            score += 1; passed += 1;
            if (g.star && !g.got) starChain = 0;
            tone(520, 0.07, "triangle", 0.08);
            var nl = 1 + Math.floor(passed / 6);
            if (nl > level) {
              level = nl;
              feedback("レベル " + level + "!", "lv");
              tone(784, 0.1, "triangle", 0.12, null, 0.05);
              tone(988, 0.1, "triangle", 0.12, null, 0.13);
              tone(1318, 0.18, "triangle", 0.12, null, 0.21);
            }
            render();
          }
        }
        if (g.x + GW < -20) gates.splice(i, 1);
      }
      spawnX -= sp * dt;
      while (spawnX < W + 400) addGate();
    }

    for (var k = fx.length - 1; k >= 0; k--) {
      var f = fx[k];
      f.t += dt; f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 240 * dt;
      if (f.t > 0.6) fx.splice(k, 1);
    }
    for (var q = texts.length - 1; q >= 0; q--) { texts[q].t += dt; if (texts[q].t > 0.8) texts.splice(q, 1); }
    if (shake > 0) shake = Math.max(0, shake - dt * 60);

    // ===== 描く =====
    var sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#38bdf8"); sky.addColorStop(0.7, "#bae6fd"); sky.addColorStop(1, "#fde68a");
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake * 0.5);

    ctx.fillStyle = "rgba(255,255,255,.75)";
    for (var cc = 0; cc < clouds.length; cc++) {
      var cl = clouds[cc], r = 22 * cl.s;
      ctx.beginPath();
      ctx.arc(cl.x, cl.y, r, 0, 7); ctx.arc(cl.x + r * 1.1, cl.y - r * 0.4, r * 1.2, 0, 7); ctx.arc(cl.x + r * 2.3, cl.y, r, 0, 7);
      ctx.fill();
    }
    // 地面
    ctx.fillStyle = "#f59e0b"; ctx.fillRect(0, H - 4, W, 4);

    // 柱
    for (var j = 0; j < gates.length; j++) {
      var a = gates[j], tp = a.cy - a.gap / 2, bt = a.cy + a.gap / 2;
      var pg = ctx.createLinearGradient(a.x, 0, a.x + GW, 0);
      pg.addColorStop(0, "#f472b6"); pg.addColorStop(0.5, "#fbcfe8"); pg.addColorStop(1, "#ec4899");
      ctx.fillStyle = pg;
      ctx.fillRect(a.x, -10, GW, tp + 10);
      ctx.fillRect(a.x, bt, GW, H - bt + 10);
      ctx.fillStyle = "#be185d";
      ctx.fillRect(a.x - 5, tp - 16, GW + 10, 16);
      ctx.fillRect(a.x - 5, bt, GW + 10, 16);
      if (a.star && !a.got) {
        var sx2 = a.x + GW / 2, sy2 = a.cy, pulse = 1 + Math.sin(t / 160) * 0.08;
        ctx.save(); ctx.translate(sx2, sy2); ctx.scale(pulse, pulse);
        ctx.shadowColor = "#fde047"; ctx.shadowBlur = 14;
        ctx.fillStyle = "#fde047"; ctx.beginPath();
        for (var s = 0; s < 10; s++) {
          var ang = -Math.PI / 2 + s * Math.PI / 5, rr = (s % 2 === 0) ? 16 : 7;
          ctx.lineTo(Math.cos(ang) * rr, Math.sin(ang) * rr);
        }
        ctx.closePath(); ctx.fill(); ctx.restore();
      }
    }

    // 風船
    var blink = inv > 0 && Math.floor(inv * 12) % 2 === 0;
    if (!blink) {
      ctx.save(); ctx.translate(bx, by); ctx.rotate(tilt);
      ctx.strokeStyle = "rgba(60,60,80,.7)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, BR); ctx.quadraticCurveTo(-8, BR + 16, 2, BR + 30); ctx.stroke();
      var bg = ctx.createRadialGradient(-6, -7, 3, 0, 0, BR + 3);
      bg.addColorStop(0, "#fecaca"); bg.addColorStop(1, "#ef4444");
      ctx.fillStyle = bg; ctx.beginPath(); ctx.ellipse(0, 0, BR - 1, BR + 3, 0, 0, 7); ctx.fill();
      ctx.fillStyle = "#b91c1c"; ctx.beginPath(); ctx.moveTo(-4, BR + 2); ctx.lineTo(4, BR + 2); ctx.lineTo(0, BR + 8); ctx.fill();
      ctx.restore();
    }

    for (var m = 0; m < fx.length; m++) {
      var e = fx[m];
      ctx.globalAlpha = Math.max(0, 1 - e.t / 0.6);
      ctx.fillStyle = e.color; ctx.beginPath(); ctx.arc(e.x, e.y, 3.5, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.font = "bold 24px sans-serif"; ctx.textAlign = "center";
    for (var n = 0; n < texts.length; n++) {
      var x = texts[n], pt = x.t / 0.8;
      ctx.globalAlpha = Math.max(0, 1 - pt);
      ctx.lineWidth = 4; ctx.strokeStyle = "rgba(0,0,0,.45)";
      ctx.strokeText(x.text, x.x, x.y - pt * 30);
      ctx.fillStyle = x.color; ctx.fillText(x.text, x.x, x.y - pt * 30);
    }
    ctx.globalAlpha = 1;
    if (running && starChain >= 2) {
      ctx.font = "bold 20px sans-serif"; ctx.fillStyle = "#b45309";
      ctx.fillText("星 " + starChain + "れんぞく", W / 2, H - 20);
    }
    ctx.restore();
    requestAnimationFrame(frame);
  }

  startBtn.addEventListener("click", startGame);
  var muteBtn = document.getElementById("muteBtn");
  function showMute() { muteBtn.textContent = soundOn ? "🔊" : "🔇"; }
  muteBtn.addEventListener("click", function () {
    soundOn = !soundOn;
    try { localStorage.setItem("fuwa_sound", soundOn ? "on" : "off"); } catch (e) {}
    showMute();
    if (soundOn) tone(660, 0.1, "triangle", 0.14);
  });
  showMute();
  window.addEventListener("resize", resize);
  resize(); render();
  requestAnimationFrame(frame);
})();
</script>
<script data-goatcounter="https://tomu-games.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
