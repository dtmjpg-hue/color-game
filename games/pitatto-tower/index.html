<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ぴたっとタワー</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0f172a; color: #fff;
    font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #hud { padding: 10px 14px; background: #0b1224; }
  #stats { display: flex; justify-content: space-between; font-size: 17px; font-weight: bold; }
  #hint { margin-top: 6px; text-align: center; font-size: 15px; color: #fbbf24; }
  #field { position: relative; flex: 1; overflow: hidden;
    background: linear-gradient(180deg, #1e1b4b 0%, #312e81 45%, #4c1d95 100%); }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .fb { position: absolute; left: 0; right: 0; text-align: center; font-size: 26px; font-weight: bold;
    pointer-events: none; animation: rise .8s ease-out forwards; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  .good { color: #86efac; }
  .perfect { color: #fde047; font-size: 32px; }
  .bad { color: #fca5a5; }
  @keyframes rise { to { transform: translateY(-48px); opacity: 0; } }
  #overlay { position: absolute; inset: 0; background: rgba(8,10,28,.95); display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px; text-align: center; z-index: 10; }
  #overlay h1 { font-size: 30px; margin: 0 0 14px; }
  #overlay p { font-size: 17px; line-height: 1.7; margin: 4px 0; max-width: 320px; }
  .big { font-size: 46px; font-weight: bold; color: #fbbf24; margin: 6px 0; }
  button { margin-top: 22px; min-width: 200px; min-height: 56px; padding: 14px 36px; font-size: 22px;
    font-weight: bold; color: #3a2a00; background: #fbbf24; border: none; border-radius: 14px; cursor: pointer; }
  #muteBtn { position: absolute; right: 10px; bottom: 10px; z-index: 20; width: 46px; height: 46px;
    min-width: 46px; min-height: 46px; margin: 0; padding: 0; font-size: 22px; border-radius: 50%;
    background: rgba(255,255,255,.18); color: #fff; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div id="stats">
      <span>スコア <span id="score">0</span></span>
      <span>レベル <span id="level">1</span></span>
      <span>ライフ <span id="life">♥♥♥</span></span>
    </div>
    <div id="hint">動くブロックを、タップで落として積もう</div>
  </div>
  <div id="field">
    <canvas id="cv"></canvas>
  </div>
  <div id="overlay">
    <h1 id="ovTitle">ぴたっとタワー</h1>
    <div id="ovBody">
      <p>左右に動くブロックを、<b>タップして落とそう</b>。</p>
      <p>下のブロックからはみ出した部分は<b>切り落とされて</b>、だんだん細くなるよ。</p>
      <p>ぴったり重なると<b>大ボーナス</b>で、幅も少し戻る!</p>
      <p>完全にはずすとミス。ライフは3つ。レベルが上がると速くなるよ。</p>
    </div>
    <button id="startBtn" type="button">スタート</button>
  </div>
  <button id="muteBtn" type="button" aria-label="音のオンとオフ">🔊</button>
</div>

<script>
(function () {
  var field = document.getElementById("field");
  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var scoreEl = document.getElementById("score");
  var levelEl = document.getElementById("level");
  var lifeEl = document.getElementById("life");
  var overlay = document.getElementById("overlay");
  var ovTitle = document.getElementById("ovTitle");
  var ovBody = document.getElementById("ovBody");
  var startBtn = document.getElementById("startBtn");

  // ===== 効果音(Web Audioで作る。音声ファイルは使わない) =====
  var soundOn = true;
  try { soundOn = localStorage.getItem("pitatower_sound") !== "off"; } catch (e) {}
  var ac = null;
  function audio() {
    if (!soundOn) return null;
    try {
      if (!ac) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) ac = new AC(); }
      if (ac && ac.state === "suspended") ac.resume();
    } catch (e) { ac = null; }
    return ac;
  }
  function tone(freq, dur, type, vol, slideTo, delay) {
    var a = audio();
    if (!a) return;
    try {
      var t0 = a.currentTime + (delay || 0);
      var o = a.createOscillator(), g = a.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(freq, t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(a.destination);
      o.start(t0); o.stop(t0 + dur + 0.03);
    } catch (e) {}
  }
  function overSound() {
    tone(392, 0.22, "triangle", 0.14);
    tone(330, 0.22, "triangle", 0.14, null, 0.2);
    tone(262, 0.45, "triangle", 0.14, null, 0.4);
  }

  var BH = 30;            // ブロックの高さ
  var PERFECT = 6;        // ぴったり扱いにするズレ(px)
  var MIN_W = 8;          // これより細くなったら、はずしたことにする

  var W = 0, H = 0, dpr = 1, floorY = 0, baseW = 0;
  var score = 0, level = 1, lives = 3, placed = 0, combo = 0;
  var running = false, gen = 0, lastDrop = 0;
  var layers = [], falls = [], mover = null;
  var cam = 0, camTarget = 0, shake = 0, lastT = 0;

  function loadBest() {
    try { return parseInt(localStorage.getItem("pitatower_best") || "0", 10) || 0; } catch (e) { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem("pitatower_best", String(v)); } catch (e) {}
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = field.clientWidth;
    H = field.clientHeight;
    cv.width = Math.floor(W * dpr);
    cv.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    floorY = H - 56;
    baseW = Math.max(90, Math.min(W * 0.56, 230));
  }

  function render() {
    scoreEl.textContent = String(score);
    levelEl.textContent = String(level);
    var hearts = "";
    for (var i = 0; i < 3; i++) hearts += (i < lives ? "♥" : "♡");
    lifeEl.textContent = hearts;
  }

  function feedback(text, cls) {
    var f = document.createElement("div");
    f.className = "fb " + cls;
    f.textContent = text;
    f.style.top = Math.round(H * 0.2) + "px";
    field.appendChild(f);
    setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 850);
  }

  function worldY(i) { return floorY - (i + 1) * BH; }   // i番目のブロックの上端(世界座標)
  function hueOf(i) { return (200 + i * 13) % 360; }

  function speedNow() { return Math.min(130 + (level - 1) * 36, 460); }

  function spawnMover(w) {
    var fromLeft = (placed % 2 === 0);
    mover = { w: w, x: fromLeft ? 0 : W - w, dir: fromLeft ? 1 : -1 };
  }

  function startGame() {
    gen += 1;
    audio(); tone(660, 0.08, "triangle", 0.14);
    score = 0; level = 1; lives = 3; placed = 0; combo = 0;
    layers = [{ x: (W - baseW) / 2, w: baseW }];
    falls = [];
    cam = 0; camTarget = 0; shake = 0;
    spawnMover(baseW);
    render();
    overlay.style.display = "none";
    lastDrop = 0;
    running = true;
  }

  function endGame(myGen) {
    if (myGen !== gen) return;
    running = false;
    var best = loadBest();
    var isNew = score > best;
    if (isNew) { best = score; saveBest(best); }
    ovTitle.textContent = "ゲームオーバー";
    ovBody.innerHTML =
      '<p>最終スコア</p><div class="big">' + score + '点</div>' +
      '<p>' + placed + '段 積めたよ(レベル ' + level + ')</p>' +
      '<p>ベスト: ' + best + '点' + (isNew ? '(新記録!)' : '') + '</p>';
    startBtn.textContent = "もういちど";
    overlay.style.display = "flex";
    overSound();
  }

  function addFall(x, w, i, hue) {
    falls.push({ x: x, y: worldY(i), w: w, vy: 0, hue: hue, a: 1 });
  }

  function drop() {
    if (!running || !mover) return;
    var now = performance.now();
    if (now - lastDrop < 90) return;      // 同じタップの二重反応を防ぐ
    lastDrop = now;

    var top = layers[layers.length - 1];
    var i = layers.length;                 // これから積む段
    var left = Math.max(mover.x, top.x);
    var right = Math.min(mover.x + mover.w, top.x + top.w);
    var overlap = right - left;

    if (overlap < MIN_W) {
      // 完全にはずした: ライフが減って、同じ幅のブロックがやり直し
      addFall(mover.x, mover.w, i, hueOf(i));
      combo = 0;
      lives -= 1;
      shake = 10;
      feedback("ミス!", "bad");
      tone(300, 0.4, "sawtooth", 0.11, 80);
      render();
      if (lives <= 0) {
        running = false;
        var g = gen;
        setTimeout(function () { endGame(g); }, 700);
      } else {
        spawnMover(mover.w);
      }
      return;
    }

    var nx = left, nw = overlap;
    if (Math.abs(mover.x - top.x) <= PERFECT) {
      // ぴったり: 幅が少し戻る
      nw = Math.min(top.w + 10, baseW);
      nx = Math.max(0, Math.min(W - nw, top.x - (nw - top.w) / 2));
      combo += 1;
      score += 2 + Math.min(combo, 5);
      feedback(combo >= 2 ? "パーフェクト! x" + combo : "パーフェクト!", "perfect");
      tone(Math.min(520 + combo * 70, 1200), 0.14, "triangle", 0.16); tone(Math.min(780 + combo * 105, 1800), 0.18, "triangle", 0.14, null, 0.08);
    } else {
      combo = 0;
      score += 1;
      // はみ出した部分は、落ちていく
      if (mover.x < top.x) addFall(mover.x, top.x - mover.x, i, hueOf(i));
      if (mover.x + mover.w > top.x + top.w) addFall(top.x + top.w, (mover.x + mover.w) - (top.x + top.w), i, hueOf(i));
      feedback("+1", "good");
      tone(330, 0.08, "square", 0.07, 260);
    }
    layers.push({ x: nx, w: nw });
    placed += 1;
    level = 1 + Math.floor(placed / 6);
    render();
    spawnMover(nw);
  }

  field.addEventListener("pointerdown", function (ev) {
    ev.preventDefault();
    if (!running) return;
    drop();
  });

  function blockPath(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function drawBlock(x, y, w, hue, alpha) {
    ctx.globalAlpha = alpha;
    blockPath(x, y, w, BH - 2, Math.min(6, w / 2));
    ctx.fillStyle = "hsl(" + hue + ",75%,58%)";
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.28)";
    ctx.fillRect(x + 3, y + 3, Math.max(0, w - 6), 5);
    ctx.globalAlpha = 1;
  }

  function frame(t) {
    var dt = Math.min(0.05, (t - lastT) / 1000 || 0);
    lastT = t;

    if (running && mover) {
      mover.x += mover.dir * speedNow() * dt;
      if (mover.x <= 0) { mover.x = 0; mover.dir = 1; }
      if (mover.x + mover.w >= W) { mover.x = W - mover.w; mover.dir = -1; }
    }
    for (var k = falls.length - 1; k >= 0; k--) {
      var f = falls[k];
      f.vy += 1500 * dt;
      f.y += f.vy * dt;
      f.a = Math.max(0, f.a - dt * 1.1);
      if (f.a <= 0) falls.splice(k, 1);
    }
    var topIdx = layers.length - 1;
    camTarget = Math.max(0, H * 0.5 - worldY(topIdx));
    cam += (camTarget - cam) * Math.min(1, dt * 8);
    if (shake > 0) shake = Math.max(0, shake - dt * 60);

    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, 0);

    // 地面
    ctx.fillStyle = "#0b1224";
    ctx.fillRect(0, floorY + cam, W, H);
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(0, floorY + cam, W, 3);

    for (var i = 0; i < layers.length; i++) {
      drawBlock(layers[i].x, worldY(i) + cam, layers[i].w, hueOf(i), 1);
    }
    for (var j = 0; j < falls.length; j++) {
      drawBlock(falls[j].x, falls[j].y + cam, falls[j].w, falls[j].hue, falls[j].a);
    }
    if (running && mover) {
      drawBlock(mover.x, worldY(layers.length) + cam, mover.w, hueOf(layers.length), 1);
    }
    ctx.restore();
    requestAnimationFrame(frame);
  }

  startBtn.addEventListener("click", startGame);
  var muteBtn = document.getElementById("muteBtn");
  function showMute() { muteBtn.textContent = soundOn ? "🔊" : "🔇"; }
  muteBtn.addEventListener("click", function () {
    soundOn = !soundOn;
    try { localStorage.setItem("pitatower_sound", soundOn ? "on" : "off"); } catch (e) {}
    showMute();
    if (soundOn) tone(660, 0.1, "triangle", 0.14);
  });
  showMute();

  window.addEventListener("resize", function () { resize(); });
  resize();
  layers = [{ x: (W - baseW) / 2, w: baseW }];
  render();
  requestAnimationFrame(frame);
})();
</script>
<script data-goatcounter="https://tomu-games.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
