<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>シンプルコインキャッチ</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            color: #fff;
            user-select: none; /* テキスト選択を禁止 */
            -webkit-user-select: none; /* Safari用 */
            -moz-user-select: none; /* Firefox用 */
            -ms-user-select: none; /* IE/Edge用 */
            touch-action: manipulation; /* タップディレイ防止、標準動作の抑制 */
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: #3498db; /* 青い空 */
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
        }

        #score-display, #timer-display {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            z-index: 100;
        }

        #score-display {
            top: 10px;
            left: 10px;
        }

        #timer-display {
            top: 10px;
            right: 10px;
        }

        #coins-area {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden; /* コインが画面外に出てもスクロールさせない */
            top: 0;
            left: 0;
        }

        .coin {
            position: absolute;
            width: 50px;
            height: 50px;
            background-color: #f1c40f; /* 金色 */
            border-radius: 50%;
            border: 3px solid #f39c12; /* 濃い金色 */
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            will-change: transform; /* アニメーションのパフォーマンス向上 */
            transition: opacity 0.2s ease-out; /* キャッチ時のフェードアウト */
        }

        .coin.caught {
            opacity: 0;
        }

        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 200;
        }

        #game-over-screen h2 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #e74c3c;
        }

        #game-over-screen p {
            font-size: 28px;
            margin-bottom: 10px;
        }

        #retry-button {
            padding: 15px 30px;
            font-size: 28px;
            font-weight: bold;
            background-color: #2ecc71; /* 緑 */
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            margin-top: 30px;
            box-shadow: 0 5px 0 #27ae60;
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.1s;
        }

        #retry-button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #27ae60;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="score-display">Score: 0</div>
        <div id="timer-display">Time: 60</div>
        <div id="coins-area"></div>

        <div id="game-over-screen" style="display: none;">
            <h2>GAME OVER</h2>
            <p>Your Score: <span id="final-score">0</span></p>
            <p>High Score: <span id="high-score">0</span></p>
            <button id="retry-button">RETRY</button>
        </div>
    </div>

    <script>
        const gameContainer = document.getElementById('game-container');
        const scoreDisplay = document.getElementById('score-display');
        const timerDisplay = document.getElementById('timer-display');
        const coinsArea = document.getElementById('coins-area');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreSpan = document.getElementById('final-score');
        const highScoreSpan = document.getElementById('high-score');
        const retryButton = document.getElementById('retry-button');

        let score = 0;
        let highScore = localStorage.getItem('coinCatchHighScore') || 0;
        let gameTime = 60; // seconds
        let coins = []; // { element: HTMLElement, x: number, y: number, speed: number }
        let isGameRunning = false;
        let animationFrameId;
        let coinSpawnIntervalId;
        let gameTimerIntervalId;

        const COIN_SIZE = 50; // px
        const COIN_SPAWN_INTERVAL = 500; // ms
        const MAX_FALL_SPEED = 5; // px per frame
        const MIN_FALL_SPEED = 2; // px per frame
        const INITIAL_COIN_Y_OFFSET = -COIN_SIZE; // コインが画面上部から出現する位置

        function initGame() {
            score = 0;
            gameTime = 60;
            coins = [];
            isGameRunning = true;

            scoreDisplay.textContent = `Score: ${score}`;
            timerDisplay.textContent = `Time: ${gameTime}`;
            gameOverScreen.style.display = 'none';
            coinsArea.innerHTML = ''; // 既存のコインをクリア

            highScore = localStorage.getItem('coinCatchHighScore') || 0;
            highScoreSpan.textContent = highScore;

            startGameLoop();
        }

        function startGameLoop() {
            // 以前のインターバルやアニメーションフレームをクリア
            clearInterval(coinSpawnIntervalId);
            clearInterval(gameTimerIntervalId);
            cancelAnimationFrame(animationFrameId);

            // コイン生成を開始
            coinSpawnIntervalId = setInterval(spawnCoin, COIN_SPAWN_INTERVAL);

            // ゲームタイマーを開始
            gameTimerIntervalId = setInterval(() => {
                if (!isGameRunning) return;
                gameTime--;
                timerDisplay.textContent = `Time: ${gameTime}`;
                if (gameTime <= 0) {
                    endGame();
                }
            }, 1000);

            // コインアニメーションを開始
            animateCoins();
        }

        function spawnCoin() {
            if (!isGameRunning) return;

            const coinElement = document.createElement('div');
            coinElement.classList.add('coin');

            // コインのX座標をランダムに設定 (画面幅 - コインサイズ)
            const x = Math.random() * (gameContainer.clientWidth - COIN_SIZE);
            // コインの落下速度をランダムに設定
            const speed = MIN_FALL_SPEED + Math.random() * (MAX_FALL_SPEED - MIN_FALL_SPEED);

            // スタイルで初期位置を設定（transformの基準点）
            coinElement.style.left = `${x}px`;
            coinElement.style.top = `${INITIAL_COIN_Y_OFFSET}px`;
            
            coinsArea.appendChild(coinElement);

            coins.push({
                element: coinElement,
                x: x, // 初期X座標
                y: INITIAL_COIN_Y_OFFSET, // 初期Y座標
                speed: speed,
            });
        }

        function animateCoins() {
            if (!isGameRunning) {
                cancelAnimationFrame(animationFrameId);
                return;
            }

            const gameHeight = gameContainer.clientHeight;
            const newCoins = [];

            coins.forEach(coin => {
                coin.y += coin.speed; // Y座標を更新
                // transformを使って移動 (left/topからの相対位置でtranslateYを適用)
                coin.element.style.transform = `translateY(${coin.y - INITIAL_COIN_Y_OFFSET}px)`;

                if (coin.y < gameHeight) {
                    newCoins.push(coin);
                } else {
                    // コインが画面下部に到達した場合、DOMから削除
                    if (coin.element.parentNode) {
                        coinsArea.removeChild(coin.element);
                    }
                }
            });

            coins = newCoins; // 画面内に残ったコインのみを保持
            animationFrameId = requestAnimationFrame(animateCoins);
        }

        function handleTap(event) {
            if (!isGameRunning) return;

            // タップまたはタッチイベントの座標を取得
            const clientX = event.clientX || (event.touches && event.touches[0].clientX);
            const clientY = event.clientY || (event.touches && event.touches[0].clientY);

            if (clientX === undefined || clientY === undefined) return;

            // タップされたコインを探す
            // 配列から要素を削除しやすいため、逆順にイテレート
            for (let i = coins.length - 1; i >= 0; i--) {
                const coin = coins[i];
                // コインの現在の画面上の位置とサイズを取得
                const rect = coin.element.getBoundingClientRect(); 

                // タップ座標がコインの範囲内にあるかチェック
                if (clientX >= rect.left && clientX <= rect.right &&
                    clientY >= rect.top && clientY <= rect.bottom) {
                    
                    // フェードアウトアニメーション用のクラスを追加
                    coin.element.classList.add('caught');

                    // アニメーション後にDOMからコインを削除
                    setTimeout(() => {
                        if (coin.element.parentNode) {
                            coinsArea.removeChild(coin.element);
                        }
                    }, 200); // CSSのtransition時間と合わせる

                    coins.splice(i, 1); // 配列からコインを削除
                    score++;
                    scoreDisplay.textContent = `Score: ${score}`;
                    return; // 1回のタップで1つのコインのみキャッチ
                }
            }
        }
        
        // モバイルでの反応性を高めるため 'touchstart' を使用
        // e.preventDefault() でデフォルトのタッチ動作（スクロール、ズームなど）を防止
        gameContainer.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            handleTap(e);
        }, { passive: false }); // passive: false を設定して preventDefault を許可

        // デスクトップ用やフォールバックとして 'click' イベントも設定
        gameContainer.addEventListener('click', handleTap); 

        function endGame() {
            isGameRunning = false;
            clearInterval(coinSpawnIntervalId);
            clearInterval(gameTimerIntervalId);
            cancelAnimationFrame(animationFrameId);

            finalScoreSpan.textContent = score;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('coinCatchHighScore', highScore);
            }
            highScoreSpan.textContent = highScore;
            gameOverScreen.style.display = 'flex';
        }

        retryButton.addEventListener('click', initGame);

        // ゲームの初期設定と開始
        initGame();
    </script>
<script data-goatcounter="https://tomu-games.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
