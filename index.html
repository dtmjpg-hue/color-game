<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>シンプルコインキャッチ</title>
    <style>
        /* 全体のスタイル */
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden; /* スクロールを禁止 */
            touch-action: manipulation; /* ブラウザのジェスチャーを無効化（ピンチズームなど） */
            user-select: none; /* テキスト選択を禁止 */
            -webkit-user-select: none; /* Safari向け */
            -moz-user-select: none; /* Firefox向け */
            -ms-user-select: none; /* IE向け */
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #333;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative; /* 子要素のabsolute配置基準 */
        }

        /* スクリーン共通スタイル */
        #start-screen, #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        /* ゲーム画面スタイル */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: none; /* 初期状態では非表示 */
        }

        #gameCanvas {
            display: block;
            background-color: #222;
        }

        /* 情報バー（スコア・時間） */
        #info-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            background-color: rgba(0, 0, 0, 0.5);
            font-size: 1.5em;
            font-weight: bold;
            color: #FFD700; /* 金色 */
            z-index: 10;
        }

        /* テキストスタイル */
        .title {
            font-size: 2.8em;
            margin-bottom: 20px;
            color: #FFD700; /* 金色 */
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.7);
        }

        .score-text {
            font-size: 1.8em;
            margin-bottom: 10px;
        }

        .high-score-text {
            font-size: 1.5em;
            margin-top: 20px;
            color: #ccc;
        }

        /* ボタン共通スタイル */
        button {
            padding: 15px 30px;
            font-size: 1.5em;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            background-color: #4CAF50; /* 緑色 */
            color: white;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: background-color 0.3s ease, transform 0.1s ease;
            outline: none; /* フォーカス時のアウトラインを削除 */
            -webkit-tap-highlight-color: transparent; /* タップ時のハイライトを削除 */
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <!-- スタート画面 -->
    <div id="start-screen">
        <h1 class="title">シンプルコインキャッチ</h1>
        <p class="score-text">画面をタップして飛んでくるコインを集めよう！</p>
        <button id="start-button">ゲーム開始</button>
        <p class="high-score-text">ハイスコア: <span id="start-high-score-value">0</span></p>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-container">
        <div id="info-bar">
            <span>スコア: <span id="score-value">0</span></span>
            <span>時間: <span id="timer-value">30</span></span>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- ゲームオーバー画面 -->
    <div id="game-over-screen">
        <h2 class="title">ゲームオーバー！</h2>
        <p class="score-text">あなたのスコア: <span id="final-score-value">0</span></p>
        <p class="high-score-text">ハイスコア: <span id="high-score-value">0</span></p>
        <button id="retry-button">もう一度遊ぶ</button>
    </div>

    <script>
        // HTML要素の取得
        const gameContainer = document.getElementById('game-container');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-value');
        const timerDisplay = document.getElementById('timer-value');
        const finalScoreDisplay = document.getElementById('final-score-value');
        const highScoreDisplay = document.getElementById('high-score-value');
        const startHighScoreDisplay = document.getElementById('start-high-score-value');
        const startButton = document.getElementById('start-button');
        const retryButton = document.getElementById('retry-button');

        // ゲーム変数の定義
        let gameState = 'start'; // 'start', 'playing', 'gameOver'
        let score = 0;
        let highScore = 0;
        let gameTimer = 30; // ゲームの制限時間（秒）
        let lastFrameTime = 0; // 最終フレームの時刻 (performance.now())
        let coinSpawnTimer = 0; // コイン生成間隔を管理するタイマー
        let coins = []; // 画面上のコインを格納する配列
        const COIN_RADIUS = 25; // コインの半径
        const COIN_SPAWN_INTERVAL = 600; // コイン生成間隔（ミリ秒）
        const COIN_MAX_SPEED = 250; // コインの最大落下速度（ピクセル/秒）
        const COIN_MIN_SPEED = 150; // コインの最小落下速度（ピクセル/秒）
        const TOUCH_TOLERANCE = 10; // タップ判定の許容範囲（ピクセル）

        // ゲームの初期化
        function init() {
            resizeCanvas(); // キャンバスサイズをウィンドウに合わせる
            window.addEventListener('resize', resizeCanvas); // ウィンドウリサイズ時にもキャンバスを調整
            canvas.addEventListener('touchstart', handleTouch); // タッチイベントリスナーを設定
            startButton.addEventListener('click', startGame); // スタートボタンのイベントリスナー
            retryButton.addEventListener('click', startGame); // リトライボタンのイベントリスナー

            loadHighScore(); // ハイスコアを読み込む
            updateHighScoreDisplay(); // ハイスコア表示を更新
            showStartScreen(); // スタート画面を表示
        }

        // キャンバスサイズをウィンドウに合わせる関数
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // 縦長すぎる場合に備えて、info-barの高さなどを考慮して高さを調整することも可能だが、今回はシンプルに画面いっぱいに表示
        }

        // ハイスコアをLocalStorageから読み込む関数
        function loadHighScore() {
            const storedHighScore = localStorage.getItem('simpleCoinCatchHighScore');
            if (storedHighScore) {
                highScore = parseInt(storedHighScore, 10);
            }
        }

        // ハイスコアをLocalStorageに保存する関数
        function saveHighScore() {
            localStorage.setItem('simpleCoinCatchHighScore', highScore);
        }

        // スタート画面の表示
        function showStartScreen() {
            startScreen.style.display = 'flex';
            gameContainer.style.display = 'none';
            gameOverScreen.style.display = 'none';
            updateHighScoreDisplay(); // スタート画面のハイスコアも更新
        }

        // ゲーム画面の表示
        function showGameScreen() {
            startScreen.style.display = 'none';
            gameContainer.style.display = 'block';
            gameOverScreen.style.display = 'none';
        }

        // ゲームオーバー画面の表示
        function showGameOverScreen() {
            startScreen.style.display = 'none';
            gameContainer.style.display = 'none';
            gameOverScreen.style.display = 'flex';
            finalScoreDisplay.textContent = score; // 最終スコアを表示
            updateHighScoreDisplay(); // ハイスコア表示を更新
        }

        // スコア表示を更新する関数
        function updateScoreDisplay() {
            scoreDisplay.textContent = score;
        }

        // ハイスコア表示を更新する関数
        function updateHighScoreDisplay() {
            highScoreDisplay.textContent = highScore; // ゲームオーバー画面のハイスコア
            startHighScoreDisplay.textContent = highScore; // スタート画面のハイスコア
        }

        // ゲーム開始
        function startGame() {
            score = 0; // スコアをリセット
            gameTimer = 30; // タイマーをリセット
            coins = []; // コインをクリア
            gameState = 'playing'; // ゲーム状態を「プレイ中」に
            lastFrameTime = performance.now(); // 最終フレーム時刻をリセット
            coinSpawnTimer = 0; // コイン生成タイマーをリセット
            updateScoreDisplay(); // スコア表示を更新
            updateHighScoreDisplay(); // ハイスコア表示を更新
            showGameScreen(); // ゲーム画面を表示
            requestAnimationFrame(gameLoop); // ゲームループを開始
        }

        // ゲームループ
        function gameLoop(currentTime) {
            if (gameState !== 'playing') return; // プレイ中でなければループを停止

            const deltaTime = (currentTime - lastFrameTime) / 1000; // 前フレームからの経過時間（秒）
            lastFrameTime = currentTime;

            updateGame(deltaTime); // ゲームの状態を更新
            drawGame(); // ゲーム要素を描画

            requestAnimationFrame(gameLoop); // 次のフレームを要求
        }

        // ゲームの状態を更新する関数
        function updateGame(deltaTime) {
            // タイマーの更新
            gameTimer -= deltaTime;
            if (gameTimer <= 0) {
                gameTimer = 0;
                endGame(); // ゲーム終了
                return;
            }
            timerDisplay.textContent = Math.ceil(gameTimer); // 残り時間を表示（小数点以下切り上げ）

            // コインの生成
            coinSpawnTimer += deltaTime * 1000; // msに変換して加算
            if (coinSpawnTimer >= COIN_SPAWN_INTERVAL) {
                spawnCoin(); // 新しいコインを生成
                coinSpawnTimer = 0; // タイマーをリセット
            }

            // コインの位置を更新し、画面外のコインを削除
            for (let i = coins.length - 1; i >= 0; i--) {
                const coin = coins[i];
                coin.y += coin.speed * deltaTime; // コインを落下させる

                // 画面下部に到達したコインを削除
                if (coin.y - COIN_RADIUS > canvas.height) {
                    coins.splice(i, 1);
                }
            }
        }

        // ゲーム要素を描画する関数
        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // キャンバスをクリア

            // コインを描画
            coins.forEach(coin => {
                ctx.beginPath();
                ctx.arc(coin.x, coin.y, COIN_RADIUS, 0, Math.PI * 2);
                ctx.fillStyle = coin.color;
                ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.5)'; // コインの縁
                ctx.lineWidth = 2;
                ctx.stroke();
            });
        }

        // 新しいコインを生成する関数
        function spawnCoin() {
            const x = Math.random() * (canvas.width - COIN_RADIUS * 2) + COIN_RADIUS; // X座標をランダムに設定
            const y = -COIN_RADIUS; // 画面上部外から出現
            const speed = Math.random() * (COIN_MAX_SPEED - COIN_MIN_SPEED) + COIN_MIN_SPEED; // 速度をランダムに設定
            // 金色に近いHSLカラーを生成 (色相30-60度, 彩度100%, 明度50%)
            const color = `hsl(${Math.random() * 30 + 30}, 100%, 50%)`;

            coins.push({ x, y, speed, color });
        }

        // タッチイベントハンドラ
        function handleTouch(event) {
            event.preventDefault(); // デフォルトの動作（スクロールなど）を禁止

            if (gameState !== 'playing') return; // プレイ中でなければ処理しない

            const touch = event.touches[0]; // 最初のタッチイベントを取得
            const touchX = touch.clientX;
            const touchY = touch.clientY;

            // タップされた位置にあるコインを検出
            for (let i = coins.length - 1; i >= 0; i--) {
                const coin = coins[i];
                // タップ位置とコインの中心間の距離を計算
                const distance = Math.sqrt((touchX - coin.x) ** 2 + (touchY - coin.y) ** 2);

                if (distance < COIN_RADIUS + TOUCH_TOLERANCE) { // コインの半径 + 許容範囲内であればキャッチ
                    score++; // スコア加算
                    updateScoreDisplay(); // スコア表示を更新
                    coins.splice(i, 1); // キャッチしたコインを配列から削除
                    break; // 1回のタップで複数のコインをキャッチしないようにループを抜ける
                }
            }
        }

        // ゲーム終了
        function endGame() {
            gameState = 'gameOver'; // ゲーム状態を「ゲームオーバー」に
            if (score > highScore) {
                highScore = score; // ハイスコアを更新
                saveHighScore(); // ハイスコアを保存
            }
            showGameOverScreen(); // ゲームオーバー画面を表示
        }

        // ウィンドウロード時にゲームを初期化
        window.onload = init;
    </script>
</body>
</html>
