<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>単語シャッフルゲーム</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            color: #333;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #game-container {
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 30px 20px;
            width: 100%;
            max-width: 400px; /* スマホ縦画面に最適化 */
            box-sizing: border-box;
        }

        h1, h2 {
            color: #4CAF50;
            margin-bottom: 20px;
        }

        p {
            line-height: 1.6;
            margin-bottom: 10px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 15px 25px;
            font-size: 1.2em;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 20px;
            width: 100%;
            max-width: 250px; /* ボタンの最大幅 */
            box-sizing: border-box;
        }

        button:hover {
            background-color: #45a049;
        }

        #score-display {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 25px;
            color: #555;
        }

        #word-area {
            margin: 30px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 120px; /* コンテンツがない時の高さ確保 */
        }

        #shuffled-word {
            font-size: 2.5em; /* タップ対象として大きく表示 */
            font-weight: bold;
            padding: 25px 30px;
            background-color: #e8f5e9; /* 薄い緑の背景 */
            border: 3px solid #66bb6a; /* 緑色の枠線 */
            border-radius: 15px;
            cursor: pointer; /* タップ可能であることを示すカーソル */
            user-select: none; /* タップ時に文字が選択されるのを防ぐ */
            transition: background-color 0.1s ease-out, transform 0.1s ease-out;
            display: inline-block; /* paddingがサイズに影響するように */
            min-width: 150px; /* 最小幅を確保 */
            text-align: center;
            color: #388e3c; /* 濃い緑の文字 */
        }

        #shuffled-word:active {
            background-color: #c8e6c9; /* タップ時に背景色を濃くする */
            transform: scale(0.98); /* タップ時にわずかに縮小 */
        }

        #message {
            font-size: 1.1em;
            color: #f44336; /* 通常メッセージの色（赤） */
            margin-top: 20px;
            min-height: 1.5em; /* コンテンツがない時の高さ確保 */
        }

        .correct-message {
            color: #4CAF50 !important; /* 正解時のメッセージの色（緑） */
        }

        #final-score {
            font-size: 1.5em;
            font-weight: bold;
            color: #4CAF50;
            margin-top: 20px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- スタート画面 -->
        <div id="start-screen">
            <h1>単語シャッフルゲーム</h1>
            <p>遊び方:</p>
            <p>画面に表示された文字が並び替えられた単語をタップしましょう。</p>
            <p>タップするたびに文字がランダムにシャッフルされます。正しい単語の並びになったら正解です！</p>
            <button id="start-button">スタート</button>
        </div>

        <!-- ゲーム画面 -->
        <div id="game-screen" style="display:none;">
            <div id="score-display">スコア: 0</div>
            <div id="word-area">
                <div id="shuffled-word"></div>
            </div>
            <div id="message"></div>
        </div>

        <!-- 終了画面 -->
        <div id="end-screen" style="display:none;">
            <h2>ゲーム終了！</h2>
            <div id="final-score"></div>
            <button id="retry-button">もう一度遊ぶ</button>
        </div>
    </div>

    <script>
        // DOM要素の取得
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const endScreen = document.getElementById('end-screen');
        const startButton = document.getElementById('start-button');
        const retryButton = document.getElementById('retry-button');
        const scoreDisplay = document.getElementById('score-display');
        const shuffledWordDisplay = document.getElementById('shuffled-word');
        const messageDisplay = document.getElementById('message');
        const finalScoreDisplay = document.getElementById('final-score');

        // ゲームデータ
        const allWords = [
            "りんご", "みかん", "バナナ", "ぶどう", "いちご",
            "もも", "さくらんぼ", "メロン", "スイカ", "パイナップル",
            "レモン", "なし", "かき", "くり", "まめ",
            "とまと", "きゅうり", "じゃがいも", "にんじん", "たまねぎ"
        ];
        let availableWords = []; // ゲーム中に使用する単語リスト
        let currentWord = '';    // 現在の正解単語
        let score = 0;           // スコア
        let gameActive = false;  // ゲームが進行中かどうかのフラグ

        // 文字列をシャッフルする関数 (Fisher-Yatesアルゴリズム)
        function shuffleString(str) {
            let arr = str.split('');
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]]; // 要素を交換
            }
            return arr.join('');
        }

        // 新しい単語を読み込む
        function loadNewWord() {
            if (availableWords.length === 0) {
                endGame(); // 全ての単語を使い切ったらゲーム終了
                return;
            }

            // 利用可能な単語からランダムに一つ選択
            const randomIndex = Math.floor(Math.random() * availableWords.length);
            currentWord = availableWords[randomIndex];
            availableWords.splice(randomIndex, 1); // 選んだ単語をリストから削除

            // 初期シャッフルを表示
            const shuffled = shuffleString(currentWord);
            shuffledWordDisplay.textContent = shuffled;
            
            messageDisplay.textContent = ''; // メッセージをクリア
            messageDisplay.classList.remove('correct-message');
        }

        // ゲーム開始処理
        function startGame() {
            score = 0;
            availableWords = [...allWords]; // 全ての単語で初期化
            scoreDisplay.textContent = `スコア: ${score}`;
            
            // 画面の切り替え
            startScreen.style.display = 'none';
            endScreen.style.display = 'none';
            gameScreen.style.display = 'block';
            
            gameActive = true;
            loadNewWord();
        }

        // 単語がタップされた時の処理
        function handleWordTap() {
            if (!gameActive) return;

            // タップするたびに再シャッフル
            const newShuffled = shuffleString(currentWord);
            shuffledWordDisplay.textContent = newShuffled;

            // 正解判定
            if (newShuffled === currentWord) {
                score++;
                scoreDisplay.textContent = `スコア: ${score}`;
                messageDisplay.textContent = '正解！次の単語へ！';
                messageDisplay.classList.add('correct-message');
                // 短いディレイの後、新しい単語をロード
                setTimeout(() => {
                    loadNewWord();
                }, 1000); // 1秒後に次の単語
            } else {
                messageDisplay.textContent = ''; // 不正解時はメッセージなし
                messageDisplay.classList.remove('correct-message');
            }
        }

        // ゲーム終了処理
        function endGame() {
            gameActive = false;
            gameScreen.style.display = 'none';
            endScreen.style.display = 'block';
            finalScoreDisplay.textContent = `最終スコア: ${score}点`;
        }

        // イベントリスナーの設定
        startButton.addEventListener('click', startGame);
        retryButton.addEventListener('click', startGame);
        shuffledWordDisplay.addEventListener('click', handleWordTap);

        // 初期表示はスタート画面
        startScreen.style.display = 'block';
        gameScreen.style.display = 'none';
        endScreen.style.display = 'none';
    </script>
<script data-goatcounter="https://tomu-games.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
