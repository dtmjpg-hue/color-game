<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>サウンドループメーカーDX</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #222;
            color: #eee;
            text-align: center;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
            flex-direction: column;
            padding: 10px;
            box-sizing: border-box;
        }

        #game-container {
            width: 100%;
            max-width: 400px;
            border: 2px solid #555;
            border-radius: 10px;
            padding: 20px;
            background-color: #333;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        }

        h1 {
            color: #00bcd4; /* シアン */
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        #game-info p {
            margin: 5px 0;
            font-size: 1.1em;
        }

        #game-info span {
            font-weight: bold;
            color: #ffeb3b; /* 黄色 */
        }

        #buttons-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2列で配置 */
            gap: 15px;
            margin: 30px 0;
        }

        .sound-button {
            width: 100%;
            padding: 25px 10px;
            font-size: 1.2em;
            font-weight: bold;
            background-color: #4CAF50; /* デフォルト緑 */
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px #388E3C;
            outline: none;
        }

        .sound-button:active {
            background-color: #388E3C;
            transform: translateY(2px);
            box-shadow: 0 2px #388E3C;
        }

        .sound-button:disabled {
            background-color: #666;
            box-shadow: 0 4px #444;
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* 各ボタンの色 */
        .sound-button:nth-child(1) { background-color: #2196F3; box-shadow: 0 4px #1976D2; } /* 青 */
        .sound-button:nth-child(1):active { background-color: #1976D2; }
        .sound-button:nth-child(2) { background-color: #FFC107; color: #333; box-shadow: 0 4px #FFA000; } /* 橙 */
        .sound-button:nth-child(2):active { background-color: #FFA000; }
        .sound-button:nth-child(3) { background-color: #9C27B0; box-shadow: 0 4px #7B1FA2; } /* 紫 */
        .sound-button:nth-child(3):active { background-color: #7B1FA2; }
        .sound-button:nth-child(4) { background-color: #E91E63; box-shadow: 0 4px #C2185B; } /* ピンク */
        .sound-button:nth-child(4):active { background-color: #C2185B; }
        .sound-button:nth-child(5) { background-color: #009688; box-shadow: 0 4px #00796B; } /* ティール */
        .sound-button:nth-child(5):active { background-color: #00796B; }
        .sound-button:nth-child(6) { background-color: #FF5722; box-shadow: 0 4px #E64A19; } /* ディープオレンジ */
        .sound-button:nth-child(6):active { background-color: #E64A19; }

        #controls button {
            padding: 15px 30px;
            font-size: 1.3em;
            font-weight: bold;
            margin: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #FF5722;
            color: white;
            box-shadow: 0 4px #E64A19;
            transition: background-color 0.2s ease, transform 0.1s ease;
            outline: none;
        }

        #controls button:active {
            background-color: #E64A19;
            transform: translateY(2px);
            box-shadow: 0 2px #E64A19;
        }

        #start-button {
            background-color: #4CAF50;
            box-shadow: 0 4px #388E3C;
        }
        #start-button:active {
            background-color: #388E3C;
            box-shadow: 0 2px #388E3C;
        }

        #game-over-screen {
            margin-top: 20px;
            padding: 20px;
            background-color: #444;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
        }

        #game-over-screen h2 {
            color: #ffeb3b;
            margin-bottom: 15px;
            font-size: 1.8em;
        }
        #game-over-screen p {
            font-size: 1.2em;
            margin: 8px 0;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>サウンドループメーカーDX</h1>
        <div id="game-info">
            <p>残り時間: <span id="timer-display">0</span>秒</p>
            <p>スコア: <span id="score-display">0</span></p>
            <p>ユニークな音: <span id="unique-display">0</span>種類</p>
        </div>
        <div id="buttons-container">
            <!-- JavaScriptでここにボタンが挿入されます -->
        </div>
        <div id="controls">
            <button id="start-button">ゲーム開始</button>
            <button id="retry-button" style="display: none;">もう一度</button>
        </div>
        <div id="game-over-screen" style="display: none;">
            <h2>ゲーム終了！</h2>
            <p>最終スコア: <span id="final-score-display">0</span></p>
            <p>ユニークな音の種類: <span id="final-unique-display">0</span></p>
        </div>
    </div>
